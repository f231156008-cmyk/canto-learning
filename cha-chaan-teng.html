<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港在地闯关</title><style>
:root{--ink:#263b34;--green:#176b54;--pale:#edf6f2;--line:#d5e5de;--gold:#f0b640}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--ink);font:16px/1.6 Arial,"Microsoft YaHei",sans-serif}main{max-width:980px;margin:auto;padding:24px}.hero{padding:32px;border-radius:22px;background:linear-gradient(135deg,#154f40,#238369);color:#fff}.hero h1{margin:0;font-size:clamp(2rem,5vw,3.4rem)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 5px 18px #1732}.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.theme{display:block;text-align:left;background:#fff;border:1px solid var(--line);color:var(--ink);padding:20px;min-height:150px}.theme:hover{border-color:var(--green);transform:translateY(-2px)}.theme-icon{font-size:2rem}.theme strong{display:block;font-size:1.25rem;margin:5px 0}.progress{color:#63786f}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0}.dialogue{font-size:1.15rem;border-left:5px solid var(--gold);padding:14px;background:#fffaf0;border-radius:10px}.dialogue-head{display:flex;justify-content:space-between;gap:12px}.jyutping{color:#9a4e12}.translation{color:#66756e}.answers{display:grid;gap:10px;margin:16px 0}.answer-row{display:grid;grid-template-columns:1fr auto;gap:8px}button{border:0;border-radius:10px;background:var(--green);color:#fff;padding:12px 15px;cursor:pointer;font-size:1rem}button:disabled{opacity:.55}.secondary{background:var(--pale);color:var(--ink);border:1px solid var(--line)}.audio-button{background:#fff1d6;color:#704015;border:1px solid #e8c98f}.correct{color:#087443;font-weight:700}.wrong{color:#b42318;font-weight:700}.hidden{display:none!important}.finish{text-align:center}@media(max-width:560px){main{padding:14px}.hero{padding:24px}.answer-row{grid-template-columns:1fr 50px}.answer-row .audio-button{font-size:0}.answer-row .audio-button:after{content:'🔊';font-size:1rem}}
</style><link rel="stylesheet" href="site.css">
</head><body><main><header class="hero"><h1>香港在地闯关</h1></header>
<section id="lobby" class="panel"><h2>选择主题</h2><div id="themeGrid" class="themes"></div></section>
<section id="game" class="panel hidden"><div class="hud"><button id="backLobby" class="secondary">← 主题大厅</button><span id="stage"></span><span id="score"></span><span id="best"></span></div><h2 id="themeTitle"></h2><p id="situation"></p><div class="dialogue"><div class="dialogue-head"><div><strong id="speaker"></strong><div id="line"></div></div><button id="lineAudio" class="audio-button">🔊 播放题目</button></div><div id="lineJyutping" class="jyutping"></div><div id="lineTranslation" class="translation"></div></div><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" class="secondary hidden">下一关</button></section>
<section id="finish" class="panel finish hidden"><h2>闯关完成</h2><p id="finalText"></p><p id="saveStatus" aria-live="polite"></p><button id="replay">再玩一次</button> <button id="finishLobby" class="secondary">换个主题</button></section><p><a href="Canto.html">返回首页</a></p><audio id="challengeAudio"></audio><script src="cha-chaan-teng.js"></script></main></body></html>
