<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>繁体字形学习</title><style>
:root{--ink:#263b34;--green:#176b54;--pale:#edf6f2;--line:#d5e5de;--gold:#f0b640}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--ink);font:16px/1.65 Arial,"Microsoft YaHei",sans-serif}main{max-width:1050px;margin:auto;padding:24px}.hero{padding:34px;border-radius:22px;background:linear-gradient(135deg,#154f40,#238369);color:#fff}.hero h1{margin:0;font-size:clamp(2rem,5vw,3.2rem)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}nav button,.filter button{background:#fff;color:var(--ink);border:1px solid var(--line)}nav button.active,.filter button.active{background:var(--green);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.char-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;cursor:pointer;text-align:left;color:var(--ink)}.char-card.mastered{border-color:var(--green);background:var(--pale)}.glyph{font:700 3rem/1.1 serif}.simple{color:#76857e}.detail{border-left:5px solid var(--gold);background:#fffaf0}.writing-area{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:center;margin-top:18px}.writer-box{width:260px;height:260px;border:1px solid #b9cdc4;background-color:#fff;background-image:linear-gradient(#dce8e3 1px,transparent 1px),linear-gradient(90deg,#dce8e3 1px,transparent 1px),linear-gradient(45deg,transparent 49.7%,#dce8e3 50%,transparent 50.3%),linear-gradient(-45deg,transparent 49.7%,#dce8e3 50%,transparent 50.3%);background-size:130px 130px,130px 130px,100% 100%,100% 100%}.writing-actions{display:flex;gap:8px;flex-wrap:wrap}.writing-actions .secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.pair{padding:14px;border:1px solid var(--line);border-radius:12px}.authors{display:grid;gap:12px}.author{padding:16px;border-left:4px solid var(--green);background:var(--pale)}button{border:0;border-radius:10px;background:var(--green);color:#fff;padding:11px 15px;cursor:pointer;font-size:1rem}.options{display:grid;gap:10px;margin:18px 0}.options button{text-align:left}.options button:disabled{opacity:.65}.hidden{display:none}.result{font-weight:700;font-size:1.15rem}.meta{color:#66756e}.progress{height:9px;background:#e2ece8;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}@media(max-width:650px){main{padding:14px}.hero{padding:24px}.grid{grid-template-columns:1fr 1fr}.char-card{padding:12px}.writing-area{grid-template-columns:1fr}.writer-box{width:260px;max-width:100%;margin:auto}}
</style><link rel="stylesheet" href="assets/css/site.css">
</head><body><main><header class="hero"><h1>繁体字形学习</h1></header><nav><button data-view="learn" class="active">字形学习</button><button data-view="pairs">易混字</button><button data-view="quiz">字形测试</button></nav>
<section id="learn" class="view"><div class="panel"><h2>30个高频字</h2><div id="learnProgress"></div><div id="charGrid" class="grid"></div></div><div id="charDetail" class="panel detail hidden"></div></section>
<section id="pairs" class="view hidden"><div class="panel"><h2>一简对多繁</h2><div id="pairGrid" class="pairs"></div></div></section>
<section id="quiz" class="view hidden"><div class="panel"><div id="quizMeta" class="meta"></div><h2 id="question"></h2><div id="options" class="options"></div><p id="feedback" class="result" aria-live="polite"></p><p id="saveStatus" class="meta"></p><button id="nextQuestion" class="hidden">下一题</button></div></section>
<p><a href="Canto.html">返回首页</a></p><script src="assets/js/hanzi-writer.min.js"></script><script src="assets/js/characters.js"></script></main><script src="assets/js/site-nav.js"></script></body></html>
