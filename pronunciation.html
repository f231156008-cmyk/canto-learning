<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>粤语发音学习</title><style>
:root{--g:#176b54;--d:#173c32;--p:#eef6f2;--l:#d3e4dc}*{box-sizing:border-box}body{margin:0;background:#f6faf8;color:#203a33;font:16px/1.6 Arial,"Microsoft YaHei",sans-serif}main{max-width:1040px;margin:auto;padding:24px}.hero{padding:32px;border-radius:22px;background:linear-gradient(135deg,#124c3c,#217b61);color:#fff}.hero h1{margin:0;font-size:clamp(2rem,5vw,3.4rem)}nav,.buttons{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.panel{background:#fff;border:1px solid var(--l);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #1232}.zone[hidden]{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}.tones{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:9px;overflow-x:auto}button{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#fff;cursor:pointer;font-weight:650}.soft,.chip,.tone{background:var(--p);color:var(--d);border:1px solid var(--l)}.active{background:var(--g)!important;color:#fff!important}.detail{margin-top:16px;padding:18px;border-left:5px solid #f3b73f;background:#fffaf0;border-radius:12px}.detail strong{font-size:1.35rem}.track{height:74px;position:relative;margin:7px 0;background:repeating-linear-gradient(to bottom,transparent 0 14px,#d7e5df 15px)}.track i{position:absolute;left:10%;width:80%;height:5px;background:var(--g);transform-origin:left;border-radius:4px}.t1 i{top:9px}.t2 i{top:59px;transform:rotate(-35deg)}.t3 i{top:34px}.t4 i{top:45px;transform:rotate(17deg)}.t5 i{top:53px;transform:rotate(-18deg)}.t6 i{top:50px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.word{font-size:2rem;font-weight:700}.small{color:#63776f}.correct{color:#087443;font-weight:700}.wrong{color:#b42318;font-weight:700}.mark{display:inline-block;padding:9px;margin:5px;background:var(--p);border-radius:9px}.mark select{padding:6px;margin-left:5px}a{color:var(--g)}@media(max-width:600px){main{padding:14px}.answers{grid-template-columns:repeat(2,1fr)}}
/* 六张图共用同一套隐藏音高坐标：上方为高、下方为低。 */
.track{height:82px;background:none;border-top:1px solid transparent;border-bottom:1px solid transparent}
.track i{inset:0;width:auto;height:auto;transform:none;background:var(--g);clip-path:polygon(10% var(--y1),90% var(--y2),90% calc(var(--y2) + 5%),10% calc(var(--y1) + 5%))}
.t1{--y1:8%;--y2:8%}.t2{--y1:65%;--y2:8%}.t3{--y1:40%;--y2:40%}.t4{--y1:65%;--y2:88%}.t5{--y1:65%;--y2:40%}.t6{--y1:65%;--y2:65%}
</style><link rel="stylesheet" href="assets/css/site.css">
</head><body><main><header class="hero"><h1>粤语发音学习</h1></header><nav><button class="tab active" data-zone="study">学习区</button><button class="tab soft" data-zone="test">测试区</button></nav>
<div id="study" class="zone"><section class="panel"><h2>声母</h2><div id="initials" class="grid"></div><div id="initialDetail" class="detail"></div></section><section class="panel"><h2>韵母</h2><div id="finals" class="grid"></div><div id="finalDetail" class="detail"></div></section><section class="panel"><h2>粤语六声</h2><div id="toneTracks" class="tones"></div></section></div>
<div id="test" class="zone" hidden><section class="panel"><h2>听音辨调</h2><p id="quizWord" class="word" aria-live="polite"></p><div class="buttons"><button id="quizAudio">🔊 播放题目</button><button id="newQuestion" class="soft">换一题</button><button id="retryMistakes" class="soft">重练错题</button></div><div id="toneAnswers" class="answers"></div><p id="quizResult"></p><p id="quizStats" class="small"></p></section><section class="panel"><h2>相近声调专项</h2><p id="contrastWord" class="word" aria-live="polite"></p><select id="contrastPair"><option value="1,4">第 1 声 ↔ 第 4 声</option><option value="2,5">第 2 声 ↔ 第 5 声</option><option value="3,6">第 3 声 ↔ 第 6 声</option></select><div class="buttons"><button id="contrastAudio">🔊 播放题目</button><button id="newContrast" class="soft">换一题</button></div><div id="contrastAnswers" class="answers"></div><p id="contrastResult"></p></section></div><p><a href="Canto.html">返回首页</a></p><audio id="lessonAudio"></audio><script src="assets/js/pronunciation.js"></script></main><script src="assets/js/site-nav.js"></script></body></html>
