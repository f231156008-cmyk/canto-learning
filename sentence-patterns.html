<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句式学习</title>
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
<script src="sentence-patterns.js" defer></script>
</head>
<body>
<main class="pattern-page">
  <header class="page-heading">
    <p class="eyebrow">课程 · 句式</p>
    <h1>句式学习</h1>
  </header>

  <div class="pattern-toolbar" aria-label="筛选句式">
    <label>难度
      <select id="patternLevel"><option value="全部">全部</option></select>
    </label>
    <label>用途
      <select id="patternCategory"><option value="全部">全部</option></select>
    </label>
    <span id="patternCount"></span>
  </div>

  <div class="pattern-layout">
    <nav id="patternList" class="pattern-list" aria-label="句式列表"></nav>
    <article id="patternDetail" class="pattern-detail" aria-live="polite"></article>
  </div>
</main>
</body>
</html>
